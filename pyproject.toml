[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finwave-inference-server"
version = "0.0.1"
description = "FinWave inference runtime: serves ONNX models declared by FinwaveModelCard."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "onnxruntime>=1.16",
    "numpy>=1.26,<3",
    "pillow>=10.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["src/finwave_inference_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
